groups:
  - id: registry.user
    type: attribute_group
    display_name: User Attributes
    brief: "Describes information about the user."
    attributes:
      - id: user.email
        type: string
        stability: development
        brief: >
          User email address.
        note: >
          WARNING: this attribute contains PII (personally identifiable information).
          Instrumentations SHOULD only record it when explicitly opted in by the user
          and SHOULD support redaction mechanisms.
        examples: ['a.einstein@example.com']
      - id: user.full_name
        type: string
        stability: development
        brief: >
          User's full name.
        note: >
          WARNING: this attribute contains PII (personally identifiable information).
          Instrumentations SHOULD only record it when explicitly opted in by the user
          and SHOULD support redaction mechanisms. Consider using `user.hash` instead.
        examples: ['Albert Einstein']
      - id: user.hash
        type: string
        stability: development
        brief: >
          Unique user hash to correlate information for a user in anonymized form.
        note: >
          Useful if `user.id` or `user.name` contain confidential information and cannot be used.
        examples: ['364fc68eaf4c8acec74a4e52d7d1feaa']
      - id: user.id
        type: string
        stability: development
        brief: >
          Unique identifier of the user.
        note: >
          WARNING: this attribute may contain confidential identifiers.
          When `user.id` is sensitive, prefer `user.hash` to avoid leaking PII.
        examples: ['S-1-5-21-202424912787-2692429404-2351956786-1000']
      - id: user.name
        type: string
        stability: development
        brief: >
          Short name or login/username of the user.
        note: >
          WARNING: this attribute may contain PII (personally identifiable information).
          When usernames are sensitive, prefer `user.hash` to avoid leaking PII.
        examples: ['a.einstein']
      - id: user.roles
        type: string[]
        stability: development
        brief: >
          Array of user roles at the time of the event.
        examples:
          - ['admin', 'reporting_user']

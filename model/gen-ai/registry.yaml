              brief: 'Model invocation (chat, generate_content, text_completion)'
              stability: development
            - id: embedding
              value: "EMBEDDING"
              brief: 'Embedding operation'
              stability: development
            - id: retriever
              value: "RETRIEVER"
              brief: 'Document retrieval operation'
              stability: development
            - id: tool
              value: "TOOL"
              brief: 'Tool execution operation'
              stability: development
            - id: agent
              value: "AGENT"
              brief: 'Agent invocation or creation operation'
              stability: development
            - id: reranker

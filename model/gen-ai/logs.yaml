groups:
  - id: attributes.gen_ai.logs.common
    type: attribute_group
    stability: development
    brief: >
      Common attributes for GenAI log events.
    note: |
      These attributes MAY be recorded on any GenAI log event when applicable.
      Event-specific semantic convention groups below define the additional
      attributes that are expected for each `event.name`.
    attributes:
      - ref: gen_ai.session.id
        requirement_level:
          conditionally_required: when the GenAI application maintains session context
      - ref: gen_ai.turn.id
        requirement_level: recommended
      - ref: gen_ai.step.id
        requirement_level: recommended
      - ref: event.id
        requirement_level:
          conditionally_required: when the source runtime provides a stable event identifier
      - ref: gen_ai.event.original_name
        requirement_level: opt_in
      - ref: gen_ai.react.round
        requirement_level: opt_in
      - ref: gen_ai.operation.name
        requirement_level: recommended
      - ref: gen_ai.conversation.id
        requirement_level:
          conditionally_required: when available
      - ref: gen_ai.agent.id
        requirement_level: recommended
      - ref: gen_ai.agent.name
        requirement_level: recommended
      - ref: gen_ai.agent.type
        requirement_level: recommended
      - ref: gen_ai.agent.parent.id
        requirement_level: recommended
      - ref: gen_ai.agent.parent.invocation.id
        requirement_level: recommended
      - ref: gen_ai.agent.channel
        requirement_level: opt_in
      - ref: gen_ai.response.id
        requirement_level: recommended
      - ref: gen_ai.provider.name
        requirement_level:
          conditionally_required: for model-provider operations
      - ref: user.id
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the operation ended in an error
      - ref: error.message
        requirement_level:
          conditionally_required: if additional error details are available

  - id: event.gen_ai.model.request
    name: gen_ai.model.request
    type: event
    stability: development
    brief: >
      Captures a GenAI model request, including the requested model, parameters,
      input messages, and tool definitions.
    note: |
      Instrumentations SHOULD record `gen_ai.input.messages_delta` by default for
      agent logs, as it only captures new context (e.g. new user input or tool
      results) that is not already present in earlier request/response logs. For
      the first request in a session, the delta carries the full initial input.
      `gen_ai.input.messages` SHOULD only be recorded when the context changes
      in a non-append-only way (e.g. after compaction) and cannot be
      reconstructed from previous request/response logs and the current delta.

      When recording `gen_ai.input.messages` or `gen_ai.input.messages_delta`,
      instrumentations SHOULD separate system and developer instructions into
      the dedicated `gen_ai.system_instructions` attribute and tool definitions
      into the dedicated `gen_ai.tool.definitions` attribute, and exclude both
      from the messages payload. `gen_ai.system_instructions` and
      `gen_ai.tool.definitions` SHOULD be recorded on the first request where
      they apply and whenever their value changes. They SHOULD NOT be repeated
      on later requests when unchanged.

      The request and response for one model operation SHOULD carry the same
      `gen_ai.turn.id` and `gen_ai.step.id`. For ReAct-style agents, a step
      represents one model operation; additional model operations should be
      modeled as additional steps.
    attributes:
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.model
        requirement_level: required
      - ref: gen_ai.turn.start
        requirement_level: recommended
      - ref: gen_ai.output.type
        requirement_level:
          conditionally_required: if the request includes an output format
      - ref: gen_ai.request.choice.count
        requirement_level:
          conditionally_required: if available, in the request, and not equal to 1
      - ref: gen_ai.request.seed
        requirement_level:
          conditionally_required: if the request includes a seed
      - ref: gen_ai.request.frequency_penalty
        requirement_level: recommended
      - ref: gen_ai.request.max_tokens
        requirement_level: recommended
      - ref: gen_ai.request.presence_penalty
        requirement_level: recommended
      - ref: gen_ai.request.reasoning.level
        requirement_level:
          conditionally_required: when the model supports configurable reasoning effort
      - ref: gen_ai.request.stop_sequences
        requirement_level: recommended
      - ref: gen_ai.request.temperature
        requirement_level: recommended
      - ref: gen_ai.request.top_p
        requirement_level: recommended
      - ref: gen_ai.request.top_k
        requirement_level: recommended
      - ref: gen_ai.input.messages_delta
        requirement_level: recommended
      - ref: gen_ai.input.messages
        requirement_level:
          conditionally_required: when the context changes in a non-append-only way (e.g. after compaction) and cannot be reconstructed from previous request/response logs and the current delta
      - ref: gen_ai.system_instructions
        requirement_level: recommended
      - ref: gen_ai.tool.definitions
        requirement_level: recommended
      - ref: gen_ai.context.window_size
        requirement_level: recommended

  - id: event.gen_ai.model.response
    name: gen_ai.model.response
    type: event
    stability: development
    brief: >
      Captures a GenAI model response, including generated messages, completion
      metadata, and token usage.
    note: |
      This event represents the terminal outcome of one model operation,
      including successful responses, provider errors, timeouts, cancellations,
      or failures after partial output. The request and response for one model
      operation SHOULD carry the same `gen_ai.turn.id` and `gen_ai.step.id`.
      For ReAct-style agents, a step represents one model operation; additional
      model operations should be modeled as additional steps.

      When the model operation fails, instrumentations MUST still emit
      `gen_ai.model.response` to close the request/response pair. Failed
      responses MUST set `error.type`, SHOULD set `error.message`, and SHOULD
      set `gen_ai.response.finish_reasons` to `["error"]`. If no model output
      was produced, instrumentations SHOULD omit `gen_ai.output.messages`. If
      partial output was produced before the failure, instrumentations SHOULD
      record it in `gen_ai.output.messages` and set the message
      `finish_reason` to `"error"`.

      Reasoning content from a model generation SHOULD be recorded as a
      `reasoning` part in `gen_ai.output.messages.parts`. Reasoning and final
      text from the same candidate SHOULD be represented as parts of the same
      output message. A single model generation MUST NOT be split into multiple
      `gen_ai.model.response` events only because reasoning and final text
      arrived separately. Streaming or intermediate reasoning chunks SHOULD be
      buffered into this terminal response, or represented by a future
      streaming event convention.
    attributes:
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.turn.end
        requirement_level: recommended
      - ref: gen_ai.response.id
        requirement_level: recommended
      - ref: gen_ai.response.model
        requirement_level: recommended
      - ref: gen_ai.response.finish_reasons
        requirement_level: recommended
      - ref: gen_ai.response.time_to_first_token
        requirement_level: recommended
      - ref: gen_ai.response.reasoning_time
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the model operation failed
      - ref: error.message
        requirement_level: recommended
      - ref: gen_ai.usage.input_tokens
        requirement_level: recommended
      - ref: gen_ai.usage.output_tokens
        requirement_level: recommended
      - ref: gen_ai.usage.total_tokens
        requirement_level: recommended
      - ref: gen_ai.usage.cache_creation.input_tokens
        requirement_level: recommended
      - ref: gen_ai.usage.cache_read.input_tokens
        requirement_level: recommended
      - ref: gen_ai.output.messages
        requirement_level: recommended

  - id: event.gen_ai.tool.call
    name: gen_ai.tool.call
    type: event
    stability: development
    brief: >
      Captures an agent-side tool execution request.
    note: |
      This event describes an actual tool execution initiated by an agent. It is
      distinct from a model response that merely contains a tool-call intent.
    attributes:
      - ref: gen_ai.tool.name
        requirement_level: required
      - ref: gen_ai.tool.call.id
        requirement_level: recommended
      - ref: gen_ai.tool.call.exec.id
        requirement_level: recommended
      - ref: gen_ai.tool.type
        requirement_level: recommended
      - ref: gen_ai.tool.description
        requirement_level: recommended
      - ref: gen_ai.tool.call.arguments
        requirement_level: recommended
      - ref: gen_ai.skill.name
        requirement_level:
          conditionally_required: if this tool execution loaded a skill

  - id: event.gen_ai.tool.result
    name: gen_ai.tool.result
    type: event
    stability: development
    brief: >
      Captures the result of an agent-side tool execution.
    attributes:
      - ref: gen_ai.tool.name
        requirement_level: required
      - ref: gen_ai.tool.call.id
        requirement_level: recommended
      - ref: gen_ai.tool.call.exec.id
        requirement_level: recommended
      - ref: gen_ai.tool.call.result
        requirement_level: recommended
      - ref: gen_ai.tool.call.duration
        requirement_level: recommended

  - id: event.gen_ai.context.compact
    name: gen_ai.context.compact
    type: event
    stability: development
    brief: >
      Captures context compaction performed by a GenAI agent.
    attributes:
      - ref: gen_ai.context.compaction_ratio
        requirement_level: recommended
      - ref: gen_ai.context.window_size
        requirement_level: recommended
      - ref: gen_ai.input.messages
        requirement_level: recommended

  - id: event.gen_ai.agent.invoke
    name: gen_ai.agent.invoke
    type: event
    stability: development
    brief: >
      Captures invocation or delegation of work to another GenAI agent.
    attributes:
      - ref: gen_ai.agent.peer.id
        requirement_level: recommended
      - ref: gen_ai.agent.peer.name
        requirement_level: recommended
      - ref: gen_ai.agent.invocation.id
        requirement_level: recommended
      - ref: gen_ai.input.messages
        requirement_level: recommended

  - id: event.gen_ai.agent.result
    name: gen_ai.agent.result
    type: event
    stability: development
    brief: >
      Captures the result returned by another GenAI agent.
    attributes:
      - ref: gen_ai.agent.peer.id
        requirement_level: recommended
      - ref: gen_ai.agent.peer.name
        requirement_level: recommended
      - ref: gen_ai.agent.invocation.id
        requirement_level: recommended
      - ref: gen_ai.output.messages
        requirement_level: recommended

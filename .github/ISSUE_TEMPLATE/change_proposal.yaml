name: Propose enhancement to existing conventions
description: Propose changes you'd like to see
body:
  - type: dropdown
    id: area
    attributes:
      label: Area(s)
      description: Which area(s) does your change request concern?
      multiple: true
      options:
        # NOTE: GenAI-focused areas only. error/exception/server areas are
        # kept in model/ as dependencies but not shown here.
        - docs
        - area:gen-ai
        - area:openai
  - type: textarea
    attributes:
      label: What's missing?
      description: Please describe the use-case or scenario that is not covered by the existing conventions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of solution you'd like to see.
  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it.</sub>
      default: 0
